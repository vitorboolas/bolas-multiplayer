<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolas Online</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1b1464; overflow: hidden; font-family: "Trebuchet MS", "Segoe UI", sans-serif; }
  canvas { display: block; background: radial-gradient(circle at 50% 40%, #3a2a9c, #1b1464 75%); }
  .hud { position: absolute; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,.5); pointer-events: none; display: none; }
  #ui { top: 14px; left: 14px; font-size: 22px; font-weight: bold; background: rgba(0,0,0,.35); padding: 8px 16px; border-radius: 20px; }
  #timer { top: 12px; left: 50%; transform: translateX(-50%); font-size: 40px; font-weight: bold; background: rgba(0,0,0,.4); padding: 4px 26px; border-radius: 30px; min-width: 130px; text-align: center; }
  #timer.low { background: #e53935; }
  #leaderboard { top: 14px; right: 14px; background: rgba(0,0,0,.4); padding: 10px 15px; border-radius: 16px; font-size: 14px; min-width: 170px; }
  #leaderboard h3 { margin-bottom: 6px; font-size: 16px; }
  #screen { position: absolute; inset: 0; background: rgba(20,12,70,.93); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; color: #fff; text-align: center; padding: 20px; }
  #screen h1 { font-size: clamp(44px, 9vw, 84px); letter-spacing: 4px; color: #ffd54f; text-shadow: 0 4px 0 #ff7043, 0 0 30px rgba(255,213,79,.5); margin-bottom: 8px; }
  #msg { margin-bottom: 18px; font-size: 19px; }
  #skins { display: flex; gap: 8px; margin-bottom: 14px; }
  .sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,.35); cursor: pointer; }
  .sw.sel { border-color: #fff; transform: scale(1.2); }
  #name { padding: 12px 18px; font-size: 20px; border: 4px solid #4fc3f7; border-radius: 16px; width: 270px; text-align: center; margin-bottom: 18px; outline: none; }
  #play { padding: 14px 56px; font-size: 24px; background: #66bb6a; color: #fff; border: none; border-bottom: 6px solid #388e3c; border-radius: 18px; cursor: pointer; font-weight: bold; font-family: inherit; }
  #play:disabled { opacity: .6; cursor: wait; }
  #controls { margin-top: 24px; font-size: 15px; opacity: .85; line-height: 1.8; }
</style>
</head>
<body>
<div id="screen">
  <h1>BOLAS</h1>
  <p id="msg">Jogue online com outras pessoas! Você tem 10 minutos.</p>
  <div id="skins"></div>
  <input type="text" id="name" placeholder="Seu nome" maxlength="12" value="Você">
  <button id="play">Jogar!</button>
  <div id="controls">🖱️ Mouse = mover &nbsp;|&nbsp; ␣ Espaço = dividir &nbsp;|&nbsp; W = soltar massa &nbsp;|&nbsp; Roda = zoom</div>
</div>
<div id="ui" class="hud">⚪ Massa: <span id="mass">20</span></div>
<div id="timer" class="hud">10:00</div>
<div id="leaderboard" class="hud"><h3>🏅 Ranking</h3><div id="rank"></div></div>
<canvas id="game"></canvas>
<script>
const $ = id => document.getElementById(id);
const canvas = $('game'), ctx = canvas.getContext('2d'), huds = document.querySelectorAll('.hud');
const esc = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const MATCH_MS = 10 * 60 * 1000, MAP = 5000;
const BASE = ['#4fc3f7', '#ef5350', '#66bb6a', '#ffa726', '#ab47bc', '#8d6e63'];

let ws, myId = null, playing = false, endTime = 0, color = BASE[0];
let ents = new Map(), foodList = [], lb = [];
let camX = MAP / 2, camY = MAP / 2, zoom = 1, zoomMul = 1, mouseX = 0, mouseY = 0, myMass = 0;

function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', resize); resize();

function buildSkins() {
  $('skins').innerHTML = '';
  BASE.forEach(c => {
    const d = document.createElement('div');
    d.className = 'sw' + (c === color ? ' sel' : ''); d.style.background = c;
    d.onclick = () => { color = c; buildSkins(); };
    $('skins').appendChild(d);
  });
}
buildSkins();

const send = o => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };
function showStart(msg) {
  $('msg').textContent = msg;
  $('screen').style.display = 'flex';
  huds.forEach(h => h.style.display = 'none');
  $('play').disabled = false;
}
function join() { send({ t: 'join', name: $('name').value.trim() || 'Você', color }); }
function connect(cb) {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = cb;
  ws.onmessage = e => handle(JSON.parse(e.data));
  ws.onclose = () => { playing = false; showStart('Sem conexão com o servidor. Clique em Jogar pra tentar de novo.'); };
}
$('play').onclick = () => { $('play').disabled = true; if (ws && ws.readyState === 1) join(); else connect(join); };
$('name').addEventListener('keydown', e => { if (e.key === 'Enter') $('play').click(); });

function handle(m) {
  if (m.t === 'welcome') {
    myId = m.id; playing = true; ents.clear(); foodList = [];
    endTime = Date.now() + MATCH_MS;
    $('screen').style.display = 'none';
    huds.forEach(h => h.style.display = 'block');
  } else if (m.t === 's') {
    const seen = new Set();
    for (const [id, x, y, mass, o, c, n] of m.c) {
      seen.add(id);
      let e = ents.get(id);
      if (!e) { e = { x, y, r: Math.sqrt(mass) * 4, c: c || '#888', n: n || '', ang: 0 }; ents.set(id, e); }
      else if (c) { e.c = c; e.n = n; }
      e.tx = x; e.ty = y; e.m = mass; e.o = o;
    }
    for (const id of ents.keys()) if (!seen.has(id)) ents.delete(id);
    foodList = m.f;
    if (m.lb) {
      lb = m.lb;
      $('rank').innerHTML = lb.map((r, i) => `<div${r[2] === myId ? ' style="color:#ffd54f;font-weight:bold"' : ''}>${i + 1}. ${esc(r[0])} — ${r[1]}</div>`).join('');
    }
  } else if (m.t === 'dead') {
    playing = false;
    showStart(`😅 Você foi comido! Sua maior massa: ${m.peak}. Jogue de novo!`);
  }
}

canvas.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoomMul = Math.max(0.85, Math.min(2.5, zoomMul * (e.deltaY < 0 ? 1.12 : 1 / 1.12)));
}, { passive: false });
addEventListener('keydown', e => {
  if (!playing || e.target === $('name')) return;
  if (e.code === 'Space') { e.preventDefault(); send({ t: 'split' }); }
  if (e.code === 'KeyW') send({ t: 'eject' });
});
setInterval(() => {   // manda pro servidor pra onde o mouse aponta
  if (!playing) return;
  send({ t: 'in', x: Math.round((mouseX - canvas.width / 2) / zoom + camX), y: Math.round((mouseY - canvas.height / 2) / zoom + camY) });
}, 50);

function drawCell(e) {
  const r = e.r;
  ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, 6.283);
  ctx.fillStyle = e.c; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 4 / zoom; ctx.stroke();
  if (r * zoom < 12) return;
  const ex = r * 0.28, ey = e.y - r * 0.25, er = r * 0.2;
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.arc(e.x + s * ex, ey, er, 0, 6.283); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.beginPath(); ctx.arc(e.x + s * ex + Math.cos(e.ang) * er * 0.4, ey + Math.sin(e.ang) * er * 0.4, er * 0.5, 0, 6.283);
    ctx.fillStyle = '#222'; ctx.fill();
  }
  ctx.font = `bold ${Math.min(r * 0.4, 20)}px "Trebuchet MS", Arial`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineWidth = 3 / zoom;
  ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.strokeText(e.n, e.x, e.y + r * 0.42);
  ctx.fillStyle = '#fff'; ctx.fillText(e.n, e.x, e.y + r * 0.42);
}

function frame() {
  requestAnimationFrame(frame);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let n = 0, sx = 0, sy = 0; myMass = 0;
  for (const e of ents.values()) {   // suaviza o movimento entre os pacotes do servidor
    const dx = e.tx - e.x, dy = e.ty - e.y;
    if (Math.abs(dx) + Math.abs(dy) > 1) e.ang = Math.atan2(dy, dx);
    e.x += dx * 0.4; e.y += dy * 0.4;
    e.r += (Math.sqrt(e.m) * 4 - e.r) * 0.2;
    if (e.o === myId) { n++; sx += e.x; sy += e.y; myMass += e.m; }
  }
  if (n) { camX += (sx / n - camX) * 0.4; camY += (sy / n - camY) * 0.4; }
  const tz = Math.max(0.42, Math.max(0.45, Math.min(1.15, 2.9 / Math.pow(Math.max(myMass, 20), 0.33))) * zoomMul);
  zoom += (tz - zoom) * 0.12;

  if (playing) {
    $('mass').textContent = Math.floor(myMass);
    const left = Math.max(0, endTime - Date.now()), s = Math.ceil(left / 1000);
    $('timer').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    $('timer').classList.toggle('low', s <= 30);
    if (left <= 0) { send({ t: 'leave' }); playing = false; showStart(`⏰ Tempo esgotado! Sua massa final: ${Math.floor(myMass)}. Jogue de novo!`); }
  }

  ctx.save();
  ctx.translate(canvas.width / 2, canvas.height / 2); ctx.scale(zoom, zoom); ctx.translate(-camX, -camY);
  ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 1 / zoom;
  const g = 120, vw = canvas.width / zoom, vh = canvas.height / zoom;
  const x0 = Math.floor((camX - vw / 2) / g) * g, y0 = Math.floor((camY - vh / 2) / g) * g;
  ctx.beginPath();
  for (let x = x0; x < camX + vw / 2 + g; x += g) { ctx.moveTo(x, y0); ctx.lineTo(x, camY + vh / 2 + g); }
  for (let y = y0; y < camY + vh / 2 + g; y += g) { ctx.moveTo(x0, y); ctx.lineTo(camX + vw / 2 + g, y); }
  ctx.stroke();
  ctx.strokeStyle = '#ffd54f'; ctx.lineWidth = 6 / zoom; ctx.strokeRect(0, 0, MAP, MAP);
  for (let i = 0; i < foodList.length; i += 4) {
    ctx.beginPath(); ctx.arc(foodList[i], foodList[i + 1], Math.sqrt(foodList[i + 2]) * 4, 0, 6.283);
    ctx.fillStyle = `hsl(${foodList[i + 3]},85%,62%)`; ctx.fill();
  }
  [...ents.values()].sort((a, b) => a.m - b.m).forEach(drawCell);   // maiores por cima
  ctx.restore();
}
frame();
</script>
</body>
</html>
